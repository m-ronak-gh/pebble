
name: Cross-Platform CI

on:
  push:
    branches: [main, windows-debug]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 24.04, LLVM 18)
            os: ubuntu-24.04
            platform: linux

          - name: macOS (macOS 15 ARM64, LLVM 18)
            os: macos-15
            platform: macos

          - name: Windows (x86_64, MSYS2 CLANG64)
            os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --- Linux toolchain setup ---
      - name: Install LLVM 18 (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 make

          sudo update-alternatives --install \
            /usr/bin/llvm-config llvm-config \
            /usr/bin/llvm-config-18 100

          sudo update-alternatives --install \
            /usr/bin/clang clang \
            /usr/bin/clang-18 100

          sudo update-alternatives --install \
            /usr/bin/opt opt \
            /usr/bin/opt-18 100

      # --- macOS toolchain setup ---
      - name: Install LLVM 18 (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install llvm@18

          LLVM_PATH="$(brew --prefix llvm@18)"

          echo "$LLVM_PATH/bin" >> "$GITHUB_PATH"
          echo "CC=$LLVM_PATH/bin/clang" >> "$GITHUB_ENV"
          echo "CLANG=$LLVM_PATH/bin/clang" >> "$GITHUB_ENV"
          echo "OPT=$LLVM_PATH/bin/opt" >> "$GITHUB_ENV"

      # --- Windows toolchain setup ---
      - name: Setup MSYS2 and LLVM 18 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            make
            git

      # --- Build and test on Linux & macOS ---
      - name: Build and run complete test suite (Linux & macOS)
        if: matrix.platform != 'windows'
        run: |
          C_COMPILER="${CC:-gcc}"

          echo "=== Compiler and toolchain versions ==="
          "$C_COMPILER" --version
          llvm-config --version

          echo "=== Build and run complete test suite ==="
          make CC="$C_COMPILER" test

          echo "=== Create release package ==="
          make CC="$C_COMPILER" package

      # --- Build and test on Windows ---
      - name: Build and run complete test suite (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          echo "=== Compiler and toolchain versions ==="
          clang --version
          llvm-config --version

          echo "=== Build and run complete test suite ==="
          make CC=clang test

          echo "=== Create release package ==="
          make CC=clang package
