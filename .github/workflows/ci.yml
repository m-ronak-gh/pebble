name: Cross-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 24.04, LLVM 18)
            os: ubuntu-24.04
            platform: linux

          - name: macOS (macOS 14 ARM64, LLVM 18)
            os: macos-14
            platform: macos

          - name: Windows (x86_64, LLVM 18 via MSYS2)
            os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Linux toolchain setup ---
      - name: Install LLVM 18 (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-18 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/opt opt /usr/bin/opt-18 100

      # --- macOS toolchain setup ---
      - name: Install LLVM 18 (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install llvm@18
          LLVM_PATH="$(brew --prefix llvm@18)"
          echo "$LLVM_PATH/bin" >> $GITHUB_PATH
          echo "CC=$LLVM_PATH/bin/clang" >> $GITHUB_ENV
          echo "CLANG=$LLVM_PATH/bin/clang" >> $GITHUB_ENV
          echo "OPT=$LLVM_PATH/bin/opt" >> $GITHUB_ENV

      # --- Windows toolchain setup ---
      - name: Setup MSYS2 and LLVM 18 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            make
            git

      # --- Build and test on Linux & macOS ---
      - name: Build compiler and run full test suite (Linux & macOS)
        if: matrix.platform != 'windows'
        run: |
          echo "=== Compiler and toolchain versions ==="
          ${CC:-gcc} --version
          llvm-config --version
          echo "=== Building compiler and unit tests ==="
          make test
          echo "=== Running bounds and primitive array checks ==="
          make primitive-array-tests multidim-test bounds-test semantic-bounds-test
          echo "=== Creating release package ==="
          make package

      # --- Build and test on Windows ---
      - name: Build compiler and run full test suite (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          echo "=== Compiler and toolchain versions ==="
          clang --version
          llvm-config --version
          echo "=== Building compiler and unit tests ==="
          make CC=clang test
          echo "=== Running bounds and primitive array checks ==="
          make CC=clang primitive-array-tests multidim-test bounds-test semantic-bounds-test
          echo "=== Creating release package ==="
          make CC=clang package
          
          echo "=== Windows diagnostic: first failing test ==="
          bash -x tests/driver_test.sh ./peb > driver-trace.log 2>&1 || true

          echo "=== First failure context ==="
          grep -n -B 35 -A 15 "FAIL: control flow and arithmetic" driver-trace.log || true

          echo "=== Runtime dependencies ==="
          ldd ./peb || true

          echo "=== Runtime output functions ==="
          grep -n -A 35 -B 5 -E \
            'pebble_io_print_string|pebble_print|pebble_io_|pebble_runtime_init' \
            runtime/pebble_runtime.c || true
