name: Windows Debug CI

on:
  push:
    branches: [ windows-debug ]
  pull_request:
    branches: [ windows-debug ]
  workflow_dispatch:

jobs:
  test:
    name: Windows (x86_64, MSYS2 CLANG64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and LLVM (Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            make
            git

      - name: Build compiler and run unit tests
        shell: msys2 {0}
        run: |
          echo "=== Compiler and toolchain versions ==="
          clang --version
          llvm-config --version

          echo "=== Building compiler and unit tests ==="
          make CC=clang test || {
            test_status=$?

            echo "=== Driver test comparison helpers ==="
            sed -n '1,120p' tests/driver_test.sh || true

            echo "=== Output comparison locations ==="
            grep -n -E 'EXPECTED|ACTUAL|assert|diff' tests/driver_test.sh || true

            echo "=== First failing test trace ==="
            bash -x tests/driver_test.sh ./peb > driver-trace.log 2>&1 || true
            grep -n -B 35 -A 15 \
              "FAIL: stdlib math" driver-trace.log || true

            echo "=== Math-related trace ==="
            grep -n -E -B 8 -A 12 \
              'test_stdlib_math|pebble_math|Exit code: 127|Executable not found' \
              driver-trace.log || true

            exit "$test_status"
          }

      - name: Run bounds and primitive array checks
        shell: msys2 {0}
        run: |
          make CC=clang primitive-array-tests multidim-test bounds-test semantic-bounds-test
